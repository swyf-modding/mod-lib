name: ci

# Tests the library, and builds it when the game's assemblies are available.
#
# The library compiles with -nostdlib+ against the game's own mscorlib, so a hosted runner cannot
# build it: there is no Steam, and the game is not ours to redistribute. Two tiers, then:
#
#   tests    - always runs. The behaviour tests use nothing but the BCL and compile the real source
#              files, so they work anywhere and catch the logic that a compile cannot.
#   build    - runs only where the game is present: on a self-hosted runner, or on a hosted runner
#              given the assemblies as an artifact or secret. This is the tier that catches a stripped
#              API the build calls, which is the failure mode that matters most here.
#
# The build job is skipped rather than failed when it cannot run, and says so, so a green run never
# quietly means "nothing was compiled".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Behaviour tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Each project compiles the source file it covers rather than a copy, so copy them in first
      # exactly as build.ps1 would.
      # No working-directory on these: the paths are relative to the repository root, and the copy has
      # to be made from there too. Running from tests\watcher instead would break the cp.
      - name: Run the ConfigWatcher tests
        run: |
          cp src/config/ConfigWatcher.cs tests/watcher/ConfigWatcher.cs
          dotnet run --project tests/watcher/WatcherTests.csproj

      - name: Run the window geometry tests
        run: |
          cp src/ui/WindowGeometry.cs tests/window/WindowGeometry.cs
          dotnet run --project tests/window/WindowGeometryTests.csproj

  build:
    name: Build against the game
    runs-on: ${{ vars.SWYM_RUNNER || 'self-hosted' }}
    # Manual trigger only, and deliberately so. This job needs a machine with the game installed, and a
    # self-hosted job with no runner registered does not fail - it queues, and stays queued until GitHub
    # cancels it 24 hours later. Triggering it on every push to main therefore left a stuck job and a red
    # build on each one.
    #
    # library-tests above still runs on every push and pull request, on a hosted runner, and that is the
    # tier that catches logic a compile cannot. This one is the tier that has to happen where the game is:
    # run it from the Actions tab when you want to know a plugin compiles against the real assemblies.
    #
    # A pull request from a fork has no game either, which is a second reason it is not automatic.
    #
    # If a runner is ever registered, add `github.ref == 'refs/heads/main' ||` back to the condition and
    # set SWYM_RUNNER to its labels. Nothing else needs to change.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Look for the game
        id: game
        shell: pwsh
        run: |
          $dir = $env:SWYG_GAME_DIR
          if (-not $dir) {
            $dir = "$env:ProgramFiles(x86)\Steam\steamapps\common\Scam With Your Friends Playtest"
          }
          if (-not (Test-Path "$dir\Scam With Your Friends_Data\Managed\mscorlib.dll")) {
            Write-Host "::notice::No game at $dir - skipping the build tier. The behaviour tests still ran."
            Write-Host "::notice::On a self-hosted runner, install the game and set SWYG_GAME_DIR."
            'found=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          "SWYG_GAME_DIR=$dir" >> $env:GITHUB_ENV
          'found=true' >> $env:GITHUB_OUTPUT
          Write-Host "game: $dir"

      - name: Build and test
        if: steps.game.outputs.found == 'true'
        shell: pwsh
        run: .\build.ps1 -LibraryOnly -Test -NoCopy

      - uses: actions/upload-artifact@v4
        if: steps.game.outputs.found == 'true'
        with:
          name: ScamWYF.Modding.Core
          path: bin/ScamWYF.Modding.Core.dll
          if-no-files-found: error
