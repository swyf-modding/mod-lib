name: ci

# Runs the library's behaviour tests.
#
# That is the whole of it, and the limit is deliberate. The library compiles with -nostdlib+ against
# the game's own mscorlib, so a hosted runner cannot build it: there is no Steam, and the game is not
# ours to redistribute. A hosted runner therefore has nothing to offer beyond the tests, which use
# nothing but the BCL and compile the real source files - so those run here, and the build happens on
# the machine that has the game.
#
# The alternative was a second, self-hosted job for the real build, which is the tier that catches a
# stripped API the build calls. It is not here, on purpose: a self-hosted job with no runner registered
# does not fail, it queues and sits until GitHub cancels it 24 hours later. Every push to main left a
# stuck job and a red build, and the "Run workflow" button did the same thing on demand.
#
# So the build, the API surface check and every release are manual. Run this before a release:
#
#     .\build.ps1 -LibraryOnly -Test -NoCopy
#
# That is the whole replacement, and it is one command against your own install.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Behaviour tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Each project compiles the source file it covers rather than a copy, so copy them in first
      # exactly as build.ps1 would.
      # No working-directory on these: the paths are relative to the repository root, and the copy has
      # to be made from there too. Running from tests\watcher instead would break the cp.
      - name: Run the ConfigWatcher tests
        run: |
          cp src/config/ConfigWatcher.cs tests/watcher/ConfigWatcher.cs
          dotnet run --project tests/watcher/WatcherTests.csproj

      - name: Run the window geometry tests
        run: |
          cp src/ui/WindowGeometry.cs tests/window/WindowGeometry.cs
          dotnet run --project tests/window/WindowGeometryTests.csproj